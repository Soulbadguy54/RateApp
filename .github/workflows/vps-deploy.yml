name: VPS production deployment

on:
  # Only main CI, after all four required jobs succeed, dispatches this workflow.
  # Inputs are independently checked against live GitHub CI and main SHA.
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact main SHA that passed full CI and production smoke
        required: true
        type: string
      ci_run_id:
        description: Completed Frontend CI run ID to verify
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: rateapp-vps-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Verify full green main CI before using privileged deploy credentials
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TESTED_SHA"
          ci="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg sha "$TESTED_SHA" '
            .name == "Frontend CI" and
            .path == ".github/workflows/ci.yml" and
            .head_sha == $sha and .head_branch == "main" and
            .status == "completed" and .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch")
          ' <<<"$ci" >/dev/null
          jobs="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          for required in build backend-tests mobile-e2e production-smoke; do
            jq -e --arg name "$required" '
              any(.jobs[]; .name == $name and .conclusion == "success")
            ' <<<"$jobs" >/dev/null
          done
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/soulbadguy54/rateapp-api:${{ steps.revision.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            GITHUB_SHA=${{ steps.revision.outputs.sha }}
          tags: ghcr.io/soulbadguy54/rateapp-web:${{ steps.revision.outputs.sha }}

      # This SHA comes from the built image tag, not from the main-based
      # workflow_run notification event (especially important on staging).
      - name: Record deployed container revision
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: echo "$DEPLOY_SHA" > deployed-sha.txt
      - name: Publish revision marker for Telegram changelog
        uses: actions/upload-artifact@v4
        with:
          name: rateapp-deploy-revision
          path: deployed-sha.txt
          retention-days: 30

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Install pinned SSH identity and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          cp deploy/ssh_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519 && test -s ~/.ssh/known_hosts
      - name: Deploy tested images over SSH
        env:
          DEPLOY_SHA: ${{ needs.publish.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GH_TOKEN" | ssh -T -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes "rateapp-deploy@111.88.215.215" "deploy $DEPLOY_SHA"
      - name: Initialize separate staging database without changing production
        env:
          DEPLOY_SHA: ${{ needs.publish.outputs.sha }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -T -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes "rateapp-deploy@111.88.215.215" "bootstrap-stage $DEPLOY_SHA"
