name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # Draft PRs are design/work-in-progress iterations: run the full suite
    # only when ready_for_review, and again on changes after that.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only supersede outdated PR checks, not main/develop release pipelines.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce initial JS payload budget
        run: python scripts/check_bundle.py

      - name: Check Python API syntax
        run: python -m compileall -q api

      - name: Validate staging scripts and Caddy configurations
        run: |
          bash -n deploy/scripts/*.sh
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/deploy/Caddyfile.stage:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate production and staging frontend Docker builds
        run: |
          docker build -f Dockerfile.web.stage -t rateapp-test-stage-build .

  backend-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rateapp_test
          POSTGRES_USER: rateapp_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rateapp_test -d rateapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rateapp_test:testpass@localhost:5432/rateapp_test
      VERCEL_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Apply versioned PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Integration tests against PostgreSQL
        run: python -m unittest discover -s tests -v

  mobile-e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rateapp_e2e
          POSTGRES_USER: rateapp_e2e
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rateapp_e2e -d rateapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rateapp_e2e:testpass@localhost:5432/rateapp_e2e
      VERCEL_ENV: development
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Mobile real-browser test suite
        run: npm run test:e2e

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [build, backend-tests, mobile-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production database, API and login responses
        env:
          RATEAPP_SMOKE_BASE: https://r-app.ru
        run: python scripts/smoke_production.py
