name: Frontend CI

on:
  push:
    branches: [main, develop]
  # Full CI is reserved for the production release PR, not design iterations
  # destined for develop/staging. A manual workflow_dispatch is the explicit
  # opt-in for full tests before promotion to main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel the release/staging push runs; only supersede outdated PR CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The staging Docker publish compiles the frontend and validates that both
  # images can be built; this fast green marker only triggers its deployment.
  # It is NOT a substitute for the pre-production full test suite.
  stage-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Mark staging preview (tests deferred to production release)
        run: echo 'Preview SHA is eligible for staging image build, not production.'

  build:
    if: github.ref != 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce initial JS payload budget
        run: python scripts/check_bundle.py

      - name: Check Python API syntax
        run: python -m compileall -q api

      - name: Validate staging scripts and Caddy configurations
        run: |
          bash -n deploy/scripts/*.sh
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/deploy/Caddyfile.stage:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate production and staging frontend Docker builds
        run: |
          docker build -f Dockerfile.web.stage -t rateapp-test-stage-build .

  backend-tests:
    if: github.ref != 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rateapp_test
          POSTGRES_USER: rateapp_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rateapp_test -d rateapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rateapp_test:testpass@localhost:5432/rateapp_test
      VERCEL_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Apply versioned PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Integration tests against PostgreSQL
        run: python -m unittest discover -s tests -v

  mobile-e2e:
    if: github.ref != 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rateapp_e2e
          POSTGRES_USER: rateapp_e2e
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rateapp_e2e -d rateapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rateapp_e2e:testpass@localhost:5432/rateapp_e2e
      VERCEL_ENV: development
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Mobile real-browser test suite
        run: npm run test:e2e

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [build, backend-tests, mobile-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production database, API and login responses
        env:
          RATEAPP_SMOKE_BASE: https://r-app.ru
        run: python scripts/smoke_production.py

  # workflow_run does not reliably fire for CI created by GITHUB_TOKEN
  # workflow_dispatch after the automated merge. Explicit dispatch is the
  # second, SHA-checked handoff; never dispatch before production smoke.
  dispatch-production-after-green-ci:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, backend-tests, mobile-e2e, production-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch verified main CI run and exact tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TESTED_SHA"
          gh api --method POST "repos/$REPOSITORY/actions/workflows/vps-deploy.yml/dispatches" \
            -f ref=main -f "inputs[tested_sha]=$TESTED_SHA" \
            -f "inputs[ci_run_id]=$CI_RUN_ID" --silent
          echo "VPS deployment dispatched for verified CI run $CI_RUN_ID, SHA $TESTED_SHA."

  # The production release is explicitly authorized by the owner using the
  # release-approved label. Full required checks must all pass before merge.
  # Same-repository, owner-approved develop→main releases. The one-time infrastructure-recovery branch is allowed only for fixing
  # the second CI to VPS handoff of the already approved Discovery release.
  # No workflow_run privileged access to untrusted PR artifacts.
  promote-approved-release:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          (github.event.pull_request.head.ref == 'develop' ||
           github.event.pull_request.head.ref == 'fix/ci-to-vps-explicit-handoff-20261027') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-approved') }}
    needs: [build, backend-tests, mobile-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge ONLY the explicitly approved and tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          APPROVED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$json")" = open
          test "$(jq -r '.base.ref' <<<"$json")" = main
          test "$APPROVED_BRANCH" = develop || test "$APPROVED_BRANCH" = fix/ci-to-vps-explicit-handoff-20261027
          test "$(jq -r '.head.ref' <<<"$json")" = "$APPROVED_BRANCH"
          test "$(jq -r '.head.repo.full_name' <<<"$json")" = "$REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$json")" = "$TESTED_HEAD"
          jq -e '.labels | any(.name == "release-approved")' <<<"$json" >/dev/null
          # The GitHub API enforces branch protection and also rejects a stale
          # head SHA, so a mid-flight develop change can never be merged.
          merge_result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash -f sha="$TESTED_HEAD")"
          test "$(jq -r '.merged' <<<"$merge_result")" = true
          merged_sha="$(jq -r '.sha' <<<"$merge_result")"
          [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]
          # GITHUB_TOKEN merges intentionally do not emit a push workflow.
          # Trigger full main CI explicitly: workflow_dispatch is a documented
          # exception to token event suppression. The successful main CI then explicitly dispatches the SHA-checked VPS production workflow.
          actual_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$merged_sha"
          gh api --method POST "repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -f ref=main --silent
          echo "Approved merge $merged_sha; full main CI dispatched; VPS deploy gated on main CI."
